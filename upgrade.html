<!DOCTYPE html>

<head>
  <meta name="google-site-verification" content="5YRiOefTK9mTwEJEnLIH6BQ5xmP0NkwyfiaBWZJbdCg">

  <script async src="https://plausible.io/js/pa-DBTdINzLX2L2B_fXJF0u1.js"></script>
  <script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script>
  <style>
    :root{--arrow-color:var(--border)}
    .upg-page{max-width:960px;margin:0 auto;padding:0 1.5rem 3rem}
    .upg-page h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-0.02em;margin:2rem 0 .5rem}
    .upg-page .subtitle{color:var(--text-secondary);font-size:1rem;margin-bottom:2rem}
    .upg-selector{margin-bottom:2rem}
    .upg-selector label{font-size:.78rem;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:.4rem}
    .upg-selector select{width:100%;max-width:400px;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.95rem;background:var(--surface);color:var(--text);cursor:pointer;transition:border-color var(--transition)}
    .upg-selector select:focus{outline:none;border-color:var(--accent)}
    .upg-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;transition:all var(--transition);display:none}
    .upg-card.show{display:block}
    .upg-card:hover{border-color:var(--accent);box-shadow:var(--shadow-glow)}
    .upg-card .upg-label{font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:.3rem}
    .upg-card .upg-cost{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:.82rem;font-weight:700;padding:.2rem .6rem;border-radius:20px;margin-bottom:.6rem}
    .upg-card .upg-desc{font-size:.9rem;color:var(--text);line-height:1.55;margin-bottom:.6rem}
    .upg-card .upg-impact{font-size:.82rem;color:var(--text-secondary);line-height:1.5;padding:.75rem;background:var(--surface);border-radius:var(--radius-sm);border-left:3px solid var(--green);margin-bottom:.6rem}
    .upg-card .upg-impact strong{color:var(--green)}
    .upg-gpus{display:flex;flex-wrap:wrap;gap:.4rem}
    .upg-gpus span{padding:.25rem .55rem;background:var(--accent-light);border-radius:20px;font-size:.75rem;font-weight:600;color:var(--accent);border:1px solid rgba(232,93,4,.15)}    .upg-arrow{text-align:center;padding:.5rem 0;color:var(--text-tertiary);font-size:1.5rem}
    .upg-arrow svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:2}
    .tier-badge{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-size:.72rem;font-weight:600}
    .tier-no-gpu{background:#f0f0ff;color:#5555cc}
    .tier-cpu-only{background:#fff3e6;color:#b36b00}
    .tier-budget-gpu{background:#e6f7e6;color:#1a8a45}
    .tier-power-gpu{background:#f0e6ff;color:#8844cc}
    .tier-silicon-8-16gb{background:#e6f0ff;color:#2266cc}
    .tier-silicon-24-48gb{background:#ffe6f0;color:#cc2266}
    .tier-silicon-64-plus{background:#f0ffe6;color:#228844}
    .upg-path{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
    .upg-path .from,.upg-path .to{font-weight:600;font-size:.85rem}
    .upg-path .arrow{color:var(--accent);font-size:1.2rem}
  </style>
</head>
<body>
  <nav class="site-topbar" role="navigation" aria-label="Site navigation">
    <div class="container">
      <div class="topbar-inner">
        <span class="site-brand">🤖 Build Your Own ChatGPT</span>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light/dark mode">
          <span class="toggle-icon">🌙</span>
          <span class="toggle-label">Dark mode</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="upg-page">
    <h1>AI Hardware Upgrade Guide</h1>
    <p class="subtitle">Select your current setup to see the best upgrade paths for better local AI performance.</p>

    <div class="upg-selector">
      <label for="tier-select">Your current hardware tier</label>
      <select id="tier-select">
        <option value="">— Select your tier —</option>
        <option value="no-gpu">No GPU / Integrated graphics</option>
        <option value="cpu-only">CPU-only (running models on CPU)</option>
        <option value="budget-gpu">Budget GPU (RTX 3060 / 4060 class)</option>
        <option value="silicon-8-16gb">Apple Silicon 8-16GB unified memory</option>
        <option value="silicon-24-48gb">Apple Silicon 24-48GB unified memory</option>
        <option value="silicon-64-plus">Apple Silicon 64GB+ unified memory</option>
        <option value="power-gpu">High-end GPU (RTX 4090 / 5090 class)</option>
      </select>
    </div>

    <div id="upgrade-results"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/ebubeco/build-your-own-chatgpt" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="/models">Leaderboard</a>
        <a href="/insights">Insights</a>
        <a href="/compendium">Compendium</a>
        <a href="/">Wizard</a>
      </div>
      <p class="footer-tagline">Built for beginners. Your data never leaves your machine.</p>
    </div>
  </footer>

  <script>
    const TIER_LABELS = {
      'no-gpu':'No GPU','cpu-only':'CPU-Only','budget-gpu':'Budget GPU',
      'silicon-8-16gb':'Apple Silicon 8-16GB','silicon-24-48gb':'Apple Silicon 24-48GB',
      'silicon-64-plus':'Apple Silicon 64GB+','power-gpu':'Power GPU'
    };
    const TIER_COLORS = {
      'no-gpu':'tier-no-gpu','cpu-only':'tier-cpu-only','budget-gpu':'tier-budget-gpu',
      'silicon-8-16gb':'tier-silicon-8-16gb','silicon-24-48gb':'tier-silicon-24-48gb',
      'silicon-64-plus':'tier-silicon-64-plus','power-gpu':'tier-power-gpu'
    };

    function renderUpgrade(u) {
      const fromLabel = TIER_LABELS[u.from] || u.from;
      const toLabel = TIER_LABELS[u.to] || u.to;
      const fromCls = TIER_COLORS[u.from] || '';
      const toCls = TIER_COLORS[u.to] || '';
      return `<div class="upg-card show">
        <div class="upg-path"><span class="tier-badge ${fromCls}">${fromLabel}</span><span class="arrow">→</span><span class="tier-badge ${toCls}">${toLabel}</span></div>
        <div class="upg-label">${u.label}</div>
        <div class="upg-cost">${u.cost}</div>
        <div class="upg-desc">${u.description}</div>
        <div class="upg-impact"><strong>Impact:</strong> ${u.impact}</div>
        ${u.gpuOptions && u.gpuOptions.length ? '<div class="upg-gpus">'+u.gpuOptions.map(g=>'<span>'+g+'</span>').join('')+'</div>' : ''}
      </div>`;
    }

    async function init() {
      let data;
      try {
        const res = await fetch('data/upgrades.json');
        data = await res.json();
      } catch(e) {
        document.getElementById('upgrade-results').innerHTML='<p style="color:var(--red)">Failed to load upgrade data.</p>';
        return;
      }
      const sel = document.getElementById('tier-select');
      function update() {
        const val = sel.value;
        const container = document.getElementById('upgrade-results');
        if (!val) { container.innerHTML='<p class="tool-note">Select a tier above to see upgrade options.</p>'; return; }
        const matches = data.upgrades.filter(u => u.from === val);
        if (!matches.length) { container.innerHTML='<p class="tool-note">No upgrades found for this tier. You may already be at the top!</p>'; return; }
        container.innerHTML = '<p class="section-desc" style="margin-bottom:1rem;font-size:.9rem">Recommended upgrades from <strong>'+TIER_LABELS[val]+'</strong></p>' + matches.map(renderUpgrade).join('');
      }
      sel.addEventListener('change', update);
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script src="analytics.js"></script>
  <script src="shared.js"></script>
</body>
</html>
