<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Command Generator — Build Your Own ChatGPT</title>
  <meta name="description" content="Generate Ollama commands for any model — pull, run, API, Modelfile. Customize by use case and quality preset.">
  <meta property="og:image" content="https://build-your-own-chatgpt.vercel.app/og-image.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>!function(){var t=localStorage.getItem('theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')}();</script>
  <style>
    .cmd-page{max-width:960px;margin:0 auto;padding:2rem 1rem}
    .cmd-page h1{font-family:'Outfit',sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:0 0 .3rem}
    .cmd-page .sub{color:var(--text-secondary);font-size:.95rem;margin-bottom:1.5rem}
    .cmd-form{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem}
    @media(max-width:600px){.cmd-form{grid-template-columns:1fr}}
    .cmd-field label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);margin-bottom:.3rem}
    .cmd-field select,.cmd-field input{width:100%;padding:.6rem .75rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;background:var(--surface);color:var(--text);font-family:inherit;box-sizing:border-box}
    .cmd-field select:focus,.cmd-field input:focus{outline:none;border-color:var(--accent)}
    .cmd-search{position:relative}
    .cmd-drop{position:absolute;top:100%;left:0;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:100;display:none;max-height:240px;overflow-y:auto}
    .cmd-drop-item{padding:.5rem .75rem;cursor:pointer;font-size:.85rem;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between}
    .cmd-drop-item:hover{background:var(--surface)}
    .cmd-gen-btn{grid-column:1/-1;padding:.7rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
    .cmd-gen-btn:hover{opacity:.9}
    .cmd-out{display:none;margin-top:1.5rem}
    .cmd-block{background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
    .cmd-block h3{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;margin-bottom:.5rem}
    .cmd-block pre{background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:.6rem .8rem;font-family:'SF Mono','Fira Code',monospace;font-size:.82rem;color:var(--text);overflow-x:auto;margin-bottom:.5rem;white-space:pre-wrap;word-break:break-all}
    .cpy-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.3rem .7rem;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text);font-family:inherit;transition:all .15s}
    .cpy-btn:hover{border-color:var(--accent);color:var(--accent)}
    .cpy-btn.copied{border-color:var(--green);color:var(--green)}
    .cmd-tag{display:inline-block;font-size:.7rem;font-weight:600;padding:.2rem .5rem;border-radius:6px;background:var(--accent-light);color:var(--accent);margin-bottom:.5rem}
  </style>
</head>
<body>
  <nav class="site-topbar" role="navigation" aria-label="Site navigation">
    <div class="container">
      <div class="topbar-inner">
        <a href="index.html" style="text-decoration:none"><span class="site-brand">🤖 Build Your Own ChatGPT</span></a>
        <div style="display:flex;gap:0.75rem;align-items:center">
          <a href="compare.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Compare</a>
          <a href="compatibility.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Compatibility</a>
          <a href="commands.html" style="font-size:0.82rem;color:var(--accent);text-decoration:none;font-weight:600">Commands</a>
          <a href="cost.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Cost</a>
          <a href="compendium.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Models</a>
          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light/dark mode">
            <span class="toggle-icon">🌙</span>
          </button>
        </div>
      </div>
    </div>
  </nav>
  <main class="cmd-page">
    <h1>Ollama Command Generator</h1>
    <p class="sub">Pick a model and use case — get pull, run, API, and Modelfile commands ready to copy.</p>

    <div class="cmd-form">
      <div class="cmd-field cmd-search">
        <label>Model</label>
        <input type="text" id="mdl-search" placeholder="Search model..." autocomplete="off">
        <div class="cmd-drop" id="mdl-drop"></div>
      </div>
      <div class="cmd-field">
        <label>Quality Preset</label>
        <select id="quality">
          <option value="recommended">Recommended (Q4_K_M)</option>
          <option value="high">High Quality (Q8)</option>
          <option value="small">Smallest (Q2)</option>
        </select>
      </div>
      <div class="cmd-field">
        <label>Use Case</label>
        <select id="usecase">
          <option value="general">General Chat</option>
          <option value="coding">Coding Assistant</option>
          <option value="writing">Writing Helper</option>
          <option value="documents">Document Q&A</option>
          <option value="api">API / Developer Mode</option>
        </select>
      </div>
      <button class="cmd-gen-btn" id="gen-btn" onclick="genCommands()" disabled>Generate Commands</button>
    </div>
    <div id="out" class="cmd-out"></div>
  </main>
  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/ebubeco/build-your-own-chatgpt">GitHub</a>
        <a href="index.html">Wizard</a>
        <a href="compendium.html">All Models</a>
        <a href="compare.html">Compare</a>
        <a href="cost.html">Cost</a>
      </div>
      <p class="footer-tagline">Built for beginners. Your data never leaves your machine.</p>
    </div>
  </footer>
  <script>
    document.getElementById('theme-toggle').addEventListener('click',function(){var e=document.documentElement;var t=e.getAttribute('data-theme');var n=t==='dark'?'light':'dark';e.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.querySelector('.toggle-icon').textContent=n==='dark'?'☀️':'🌙';});
    if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.querySelector('.toggle-icon').textContent='☀️';}

    let models=[], selModel=null;

    fetch('data/models.json').then(r=>r.json()).then(d=>{models=d.models.filter(m=>!m.platformType||m.platformType==='local');});

    const sInp=document.getElementById('mdl-search'), sDrop=document.getElementById('mdl-drop');
    sInp.addEventListener('input',function(){
      const q=this.value.toLowerCase().trim();
      if(!q){sDrop.style.display='none';return;}
      const r=models.filter(m=>m.name.toLowerCase().includes(q)||(m.ollamaTag||'').includes(q)).slice(0,8);
      sDrop.innerHTML=r.map(m=>'<div class="cmd-drop-item" onclick="pickModel(\''+m.id+'\')"><strong>'+m.name+'</strong><span style="color:var(--text-tertiary);font-size:.75rem;font-family:monospace">'+m.ollamaTag+'</span></div>').join('');
      sDrop.style.display=r.length?'block':'none';
    });
    document.addEventListener('click',function(e){if(!e.target.closest('.cmd-search'))sDrop.style.display='none';});

    function pickModel(id){
      selModel=models.find(m=>m.id===id);
      sInp.value=selModel?selModel.name:'';
      sDrop.style.display='none';
      document.getElementById('gen-btn').disabled=!selModel;
    }

    const SYS_PROMPTS={general:'You are a helpful assistant. Be concise and accurate.',coding:'You are an expert software engineer. Provide working, well-commented code with error handling.',writing:'You are a professional editor. Improve clarity while preserving the author\\\'s voice.',documents:'You are a document analyst. Extract information accurately. Flag ambiguity clearly.',api:'You are a helpful assistant.'};

    function getTag(m,q){
      if(!m.quantVariants||!m.quantVariants.length)return m.ollamaTag;
      const s=q==='high'?'q8':q==='small'?'q2':'q4';
      const v=m.quantVariants.find(v=>v.tag&&v.tag.toLowerCase().includes(s));
      return v?v.tag:m.ollamaTag;
    }

    function genCommands(){
      if(!selModel)return;
      const q=document.getElementById('quality').value;
      const uc=document.getElementById('usecase').value;
      const tag=getTag(selModel,q);
      const sp=SYS_PROMPTS[uc];
      const mf='FROM '+tag+'\nSYSTEM "'+sp+'"\nPARAMETER temperature '+(uc==='coding'?'0.2':'0.7')+'\nPARAMETER num_ctx 4096';
      const out=document.getElementById('out');
      out.style.display='block';
      out.innerHTML='<div class="cmd-tag">'+selModel.name+' · '+uc+' · '+(q==='high'?'Q8':q==='small'?'Q2':'Q4_K_M')+'</div>'+
        '<div class="cmd-block"><h3>1. Pull Command</h3><pre><code>ollama pull '+tag+'</code></pre><button class="cpy-btn" onclick="cpy(this,\'ollama pull '+tag+'\')">Copy</button></div>'+
        '<div class="cmd-block"><h3>2. Run Command</h3><pre><code>ollama run '+tag+'</code></pre><button class="cpy-btn" onclick="cpy(this,\'ollama run '+tag+'\')">Copy</button></div>'+
        '<div class="cmd-block"><h3>3. API Server</h3><pre><code>ollama serve</code></pre><p style="font-size:.82rem;color:var(--text-secondary)">API at <code>http://localhost:11434</code></p><button class="cpy-btn" onclick="cpy(this,\'ollama serve\')">Copy</button></div>'+
        '<div class="cmd-block"><h3>4. Custom Modelfile</h3><pre><code>'+mf.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code></pre><p style="font-size:.82rem;color:var(--text-secondary)">Save as <code>Modelfile</code>, run: <code>ollama create my-assistant -f Modelfile</code></p><button class="cpy-btn" onclick="cpy(this,\''+mf.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">Copy Modelfile</button></div>'+
        '<div class="cmd-block"><h3>5. curl API Call</h3><pre><code>curl http://localhost:11434/api/generate -d \'{"model":"'+tag+'","prompt":"Hello","stream":false}\'</code></pre><button class="cpy-btn" onclick="cpy(this,\'curl http://localhost:11434/api/generate -d \\\'{"model":"'+tag+'","prompt":"Hello","stream":false}\\\'\')">Copy</button></div>'+
        (uc==='api'?'<div class="cmd-block"><h3>6. OpenAI-Compatible Endpoint</h3><pre><code>curl http://localhost:11434/v1/chat/completions -H "Content-Type: application/json" -d \'{"model":"'+tag+'","messages":[{"role":"user","content":"Hello"}]}\'</code></pre><button class="cpy-btn" onclick="cpy(this,\'curl http://localhost:11434/v1/chat/completions -H "Content-Type: application/json" -d \\\'{"model":"'+tag+'","messages":[{"role":"user","content":"Hello"}]}\\\'\')">Copy</button><p style="font-size:.8rem;color:var(--text-secondary);margin-top:.4rem">Base URL: <code>http://localhost:11434/v1</code></p></div>':'');
      out.scrollIntoView({behavior:'smooth'});
    }

    function cpy(btn,txt){
      navigator.clipboard.writeText(txt).then(function(){
        btn.classList.add('copied');
        var o=btn.textContent;btn.textContent='✓ Copied';
        setTimeout(function(){btn.classList.remove('copied');btn.textContent=o;},2000);
      });
    }
  </script>
  <script src="shared.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
