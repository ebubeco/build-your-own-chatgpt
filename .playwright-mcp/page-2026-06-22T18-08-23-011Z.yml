  - generic [ref=e55]:
    - heading "Tips for Better CPU Performance" [level=2] [ref=e56]
    - list [ref=e57]:
      - listitem [ref=e58]:
        - strong [ref=e59]: "Close other apps:"
        - text: CPU AI needs available RAM. Close browsers, Slack, and other memory-heavy apps.
      - listitem [ref=e60]:
        - strong [ref=e61]: "Use smaller quantizations:"
        - text: Q4_K_M is the sweet spot. Q3_K_M runs faster but slightly lower quality.
      - listitem [ref=e62]:
        - strong [ref=e63]: "Keep prompts concise:"
        - text: Long prompts use more context and slow down generation. Be direct.
      - listitem [ref=e64]:
        - strong [ref=e65]: "Use a laptop cooling pad:"
        - text: Sustained 100% CPU usage generates heat. Good airflow prevents thermal throttling.
  - generic [ref=e66]:
    - heading "Frequently Asked Questions" [level=2] [ref=e67]
    - generic [ref=e68]:
      - generic [ref=e69]:
        - heading "How fast is CPU-only AI exactly?" [level=3] [ref=e70]
        - paragraph [ref=e72]: 1-5 tokens per second for 7B models. A typical 100-token response takes 20-60 seconds. Small models (1-3B) run at 5-15 tok/s with 5-15 second responses. For comparison, GPU inference runs at 30-60 tok/s — 5-10x faster, but CPU is still usable.
      - generic [ref=e73]:
        - heading "Will CPU-only AI damage my computer?" [level=3] [ref=e74]
        - paragraph [ref=e76]: No. CPU inference uses 100% of your CPU for sustained periods, but modern CPUs throttle safely when they reach temperature limits. Laptops may get warm — ensure good ventilation and avoid using on soft surfaces like beds or couches.
      - generic [ref=e77]:
        - heading "Can I use GPU + CPU together?" [level=3] [ref=e78]
        - paragraph [ref=e80]: Yes — Ollama automatically uses GPU if available, offloading remaining layers to CPU. This is the default behavior and requires no configuration. If you add a GPU later, Ollama detects it and accelerates inference automatically — zero reconfiguration needed.
      - generic [ref=e81]:
        - heading "What if CPU-only AI is too slow for me?" [level=3] [ref=e82]
        - paragraph [ref=e84]:
          - text: Try free cloud options while you save for a GPU. Groq offers 1,000+ tokens/second free. Gemini has a generous free tier. Both work in any browser with zero setup. Or check our
          - link "upgrade guide" [ref=e85] [cursor=pointer]:
            - /url: /upgrade
          - text: for budget GPU recommendations.
