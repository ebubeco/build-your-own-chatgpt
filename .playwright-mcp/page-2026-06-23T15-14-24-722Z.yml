    - heading "Who Should Use Local AI?" [level=2] [ref=e55]
    - list [ref=e56]:
      - listitem [ref=e57]:
        - strong [ref=e58]: "Privacy-conscious users:"
        - text: Lawyers, doctors, journalists handling sensitive data.
      - listitem [ref=e59]:
        - strong [ref=e60]: "Developers:"
        - text: Code assistance without sending proprietary code to third parties.
      - listitem [ref=e61]:
        - strong [ref=e62]: "Students:"
        - text: Free AI for studying, writing, and research without subscription fees.
      - listitem [ref=e63]:
        - strong [ref=e64]: "Offline users:"
