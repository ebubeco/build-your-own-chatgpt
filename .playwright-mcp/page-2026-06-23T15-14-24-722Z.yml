  - generic [ref=e67]:
    - heading "How Local AI Works" [level=2] [ref=e68]
    - list [ref=e69]:
      - listitem [ref=e70]:
        - strong [ref=e71]: "Download a model:"
        - text: Model weights (2-40GB) are downloaded from a registry like
        - link "Ollama.com" [ref=e72] [cursor=pointer]:
          - /url: https://ollama.com
        - text: . These are the trained neural network parameters.
      - listitem [ref=e73]:
        - strong [ref=e74]: "Load into memory:"
        - text: The model is loaded into RAM or VRAM. A 7B parameter model needs ~4-6GB of memory at Q4_K_M quantization.
      - listitem [ref=e75]:
        - strong [ref=e76]: "Run inference:"
        - text: When you type a prompt, the model generates a response token by token using your computer's CPU, GPU, or both.
  - generic [ref=e77]:
    - heading "Frequently Asked Questions" [level=2] [ref=e78]
    - generic [ref=e79]:
      - generic [ref=e80]:
        - heading "Is local AI really free?" [level=3] [ref=e81]
        - paragraph [ref=e83]: Yes. Ollama and all open-source models are completely free. You pay zero for software, models, or usage. The only cost is your existing computer hardware — no subscription, no API fees, no hidden charges.
      - generic [ref=e84]:
        - heading "Does local AI need internet?" [level=3] [ref=e85]
        - paragraph [ref=e87]: Only for the initial model download. After pulling a model with Ollama, everything runs offline. No internet connection is needed for inference — your data never leaves your machine.
      - generic [ref=e88]:
        - heading "Can local AI replace ChatGPT?" [level=3] [ref=e89]
        - paragraph [ref=e91]: For most daily tasks — writing, coding, research, chat — yes. Modern open models like Qwen 2.5 7B match ChatGPT's quality. Local AI lacks multimodal features and the absolute breadth of GPT-4, but it's private, free, and works offline.
      - generic [ref=e92]:
        - heading "What hardware do I need?" [level=3] [ref=e93]
        - paragraph [ref=e95]: "At minimum: 8GB RAM and a 64-bit processor. For a good experience: 16GB RAM. For best performance: any NVIDIA GPU with 8GB+ VRAM or Apple Silicon Mac with 16GB+ unified memory. No special hardware required to start."
