  - heading "How Local AI Works" [level=1] [ref=e4]
  - paragraph [ref=e6]:
    - strong [ref=e7]: Local AI runs a large language model directly on your hardware. Here's what happens under the hood when you send a prompt — and why running locally is faster, cheaper, and more private than the cloud.
  - generic [ref=e8]:
    - 'heading "Inference: The Core Process" [level=2] [ref=e9]'
    - paragraph [ref=e10]: "When you type a message and press enter, here's the step-by-step process:"
    - list [ref=e11]:
      - listitem [ref=e12]:
        - strong [ref=e13]: "Tokenization:"
        - text: Your prompt is split into tokens (words/subwords). A model like Qwen 2.5 7B uses ~30K tokens for a typical paragraph.
      - listitem [ref=e14]:
        - strong [ref=e15]: "Forward Pass:"
        - text: Each token passes through the model's neural network layers. The model computes probabilities for the next token.
      - listitem [ref=e16]:
        - strong [ref=e17]: "Sampling:"
        - text: The next token is selected based on probability (with temperature controlling randomness).
      - listitem [ref=e18]:
        - strong [ref=e19]: "Autoregressive Loop:"
        - text: Steps 2-3 repeat, feeding each new token back in, until the model produces a stop token or the max length is reached.
  - generic [ref=e20]:
    - heading "Hardware Acceleration" [level=2] [ref=e21]
    - list [ref=e22]:
      - listitem [ref=e23]:
        - strong [ref=e24]: "CUDA (NVIDIA):"
        - text: Ollama uses NVIDIA GPUs via CUDA for fast inference. RTX 3060 12GB runs 7B models at ~30 tokens/second.
      - listitem [ref=e25]:
        - strong [ref=e26]: "Metal (Apple):"
        - text: Apple Silicon uses Metal Performance Shaders. M3 Max runs 14B models at ~20 tokens/second.
      - listitem [ref=e27]:
        - strong [ref=e28]: "ROCm (AMD):"
        - text: AMD GPUs supported via ROCm. RX 7900 XTX runs 14B models at ~25 tokens/second.
      - listitem [ref=e29]:
        - strong [ref=e30]: "CPU Inference:"
        - text: No GPU? Ollama falls back to CPU using optimized BLAS libraries. Slower but works on any computer.
  - generic [ref=e31]:
    - heading "Privacy & Security" [level=2] [ref=e32]
    - list [ref=e33]:
      - listitem [ref=e34]:
        - strong [ref=e35]: "100% Local:"
        - text: Your data never leaves your machine. No API calls, no cloud processing, no data logs.
      - listitem [ref=e36]:
        - strong [ref=e37]: "Offline:"
        - text: After the initial model download, no internet connection is required.
      - listitem [ref=e38]:
        - strong [ref=e39]: "No Account:"
        - text: No sign-up, no subscription, no credit card. Download Ollama and pull a model — that's it.
