  - generic [ref=e77]:
    - heading "Frequently Asked Questions" [level=2] [ref=e78]
    - generic [ref=e79]:
      - generic [ref=e80]:
        - heading "Is Ollama really free?" [level=3] [ref=e81]
        - paragraph [ref=e83]: Yes. Ollama is open source and completely free. All models on Ollama's library are free to download and use. No subscription, no API fees, no usage limits. You only pay for your electricity.
      - generic [ref=e84]:
        - heading "How long does it take to download a model?" [level=3] [ref=e85]
        - paragraph [ref=e87]: A 7B model (~4.7GB) takes 2-10 minutes on a typical broadband connection. A 14B model (~9GB) takes 5-20 minutes. You only download once — after that, the model is cached locally and works offline.
      - generic [ref=e88]:
        - heading "Can I use local AI with VS Code?" [level=3] [ref=e89]
        - paragraph [ref=e91]:
          - text: Yes. Install the Continue extension in VS Code, configure it to point at your local Ollama instance (
          - code [ref=e92]: http://localhost:11434
          - text: ), and you get AI code completion, chat, and refactoring — all running locally with zero API calls.
      - generic [ref=e93]:
        - heading "What is the best first model to try?" [level=3] [ref=e94]
        - paragraph [ref=e96]: Qwen 2.5 7B is the best starting point for most people. It runs on 16GB RAM, downloads in ~5 minutes, and delivers excellent quality for chat, coding, and writing. For 8GB laptops, start with Phi-4 Mini 3.8B.
