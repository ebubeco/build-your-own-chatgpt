  - 'heading "How Local AI Works: A Beginner''s Guide" [level=1] [ref=e4]'
  - paragraph [ref=e6]:
    - strong [ref=e7]: Running local AI is simpler than you think. Install Ollama, pull a model with one command, and start chatting — all on your own computer, completely free and private.
  - generic [ref=e8]:
    - 'heading "Step 1: Install Ollama" [level=2] [ref=e9]'
    - paragraph [ref=e10]:
      - link "Ollama" [ref=e11] [cursor=pointer]:
        - /url: https://ollama.com/download
      - text: is a free, open-source tool that makes running local AI as simple as installing any other app. Download the installer for Windows, macOS, or Linux, run it, and Ollama runs in the background as a system service.
    - generic [ref=e12]:
      - generic [ref=e13]: One command install (macOS/Linux)
      - generic [ref=e14]: curl -fsSL https://ollama.com/install.sh | sh
  - generic [ref=e15]:
    - 'heading "Step 2: Pull a Model" [level=2] [ref=e16]'
    - paragraph [ref=e17]: "Once Ollama is installed, open a terminal and pull a model. Models are identified by name and size tag. For most users, Qwen 2.5 7B is the best starting point:"
    - generic [ref=e18]:
      - generic [ref=e19]: Pull a model
      - generic [ref=e20]: ollama pull qwen2.5:7b
      - generic [ref=e21]: Download size
      - generic [ref=e22]: ~4.7GB (takes 2-10 minutes depending on internet speed)
  - generic [ref=e23]:
    - 'heading "Step 3: Run Your First Prompt" [level=2] [ref=e24]'
    - paragraph [ref=e25]: "Start a chat session with the model:"
    - generic [ref=e26]:
      - generic [ref=e27]: Run the model
      - generic [ref=e28]: ollama run qwen2.5:7b
    - paragraph [ref=e29]:
      - text: You'll see a
      - code [ref=e30]: ">>>"
      - text: prompt. Type your message and press Enter. The model will respond. That's it — you're running local AI!
