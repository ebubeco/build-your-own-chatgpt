    - generic [ref=e78]:
      - heading "🔧 Troubleshooting" [level=2] [ref=e79]
      - list [ref=e80]:
        - listitem [ref=e81]:
          - strong [ref=e82]: "\"Ollama is not recognized\""
          - text: — Close and reopen your terminal after installing. On Windows, search for "Command Prompt" and try again.
        - listitem [ref=e83]:
          - strong [ref=e84]: "\"Not enough space\""
          - text: — Models are 2-8GB. Check your free disk space. Try a smaller model like
          - code [ref=e85]: ollama pull phi-4-mini
          - text: (2.5GB).
        - listitem [ref=e86]:
          - strong [ref=e87]: "\"Out of memory\""
          - text: — Your model is too large for your RAM/VRAM. Close other applications and try a smaller model, or use a quantized version.
        - listitem [ref=e88]:
          - strong [ref=e89]: Model is very slow
          - text: — CPU-only inference is slower than GPU. This is normal. Use a smaller model for faster responses.
        - listitem [ref=e90]:
          - strong [ref=e91]: "\"Connection error\""
          - text: — Check your internet connection. You only need internet to download the model. After that, it works fully offline.
        - listitem [ref=e92]:
          - strong [ref=e93]: How do I use a different model?
          - text: — Run
          - code [ref=e94]: ollama pull [model-name]
          - text: then
          - code [ref=e95]: ollama run [model-name]
          - text: . See the
          - link "Model Compendium" [ref=e96] [cursor=pointer]:
            - /url: compendium.html
          - text: for options.
