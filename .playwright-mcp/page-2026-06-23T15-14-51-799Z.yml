  - generic [ref=e72]:
    - heading "Frequently Asked Questions" [level=2] [ref=e73]
    - generic [ref=e74]:
      - generic [ref=e75]:
        - heading "Can my 10-year-old laptop run AI?" [level=3] [ref=e76]
        - paragraph [ref=e78]: If it has 8GB+ RAM and a 64-bit processor (most Intel Core i5/i7 from 2015+ qualify), yes. You can run Phi-4 Mini 3.8B or SmolLM2 1.7B. Expect 1-5 tokens per second on CPU — slow but functional for basic chat and writing.
      - generic [ref=e79]:
        - heading "Can a Surface Pro run local AI?" [level=3] [ref=e80]
        - paragraph [ref=e82]: Yes. Surface Pro 7+ and newer with 16GB RAM can run Qwen 2.5 7B at 3-5 tokens/second on CPU. Surface Pro X (ARM) has limited compatibility — check Ollama's ARM support first.
      - generic [ref=e83]:
        - heading "MacBook Air vs MacBook Pro for AI?" [level=3] [ref=e84]
        - paragraph [ref=e86]: "Both work well. The key factor is RAM: 8GB runs small models, 16GB runs 7B models well, 24GB+ runs 14B+ models. MacBook Pro has active cooling (fans) for sustained workloads. MacBook Air may throttle under extended heavy use but works fine for typical chat sessions."
      - generic [ref=e87]:
        - heading "Can I run AI on a tablet or iPad?" [level=3] [ref=e88]
        - paragraph [ref=e90]: Not directly via Ollama. iPads and Android tablets cannot run Ollama natively. Your best option is a free cloud service like Gemini (gemini.google.com) or Groq (console.groq.com) — both work in the browser with zero installation.
  - generic [ref=e91]:
    - heading "Get a Precise Answer for Your Exact Laptop" [level=2] [ref=e92]
