  - generic [ref=e43]:
    - heading "How to Check Your Specs" [level=2] [ref=e44]
    - list [ref=e45]:
      - listitem [ref=e46]:
        - strong [ref=e47]: "Windows:"
        - text: Open Task Manager (Ctrl+Shift+Esc) → Performance tab → check RAM and GPU
      - listitem [ref=e48]:
        - strong [ref=e49]: "macOS:"
        - text: Click Apple icon → About This Mac → check Memory and Chip
      - listitem [ref=e50]:
        - strong [ref=e51]: "Linux:"
        - text: Run
        - code [ref=e52]: free -h
        - text: for RAM,
        - code [ref=e53]: lspci | grep VGA
        - text: for GPU
      - listitem [ref=e54]:
        - strong [ref=e55]: "Chromebook:"
        - text: Settings → About Chrome OS → Diagnostics → check RAM
