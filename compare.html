    }
    .cmp-drop {

    .cmp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }

    .cmp-out { display: none; margin-top: 2rem; overflow-x: auto; }
    .cmp-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border, #eee); border-radius: 8px; overflow: hidden; }
    .cmp-th { padding: 10px 12px; text-align: left; background: var(--surface-secondary, #f3f4f6); font-size: 13px; }
    .cmp-th-empty { padding: 10px 12px; text-align: left; background: var(--surface-secondary, #f3f4f6); font-size: 12px; }
    .cmp-td-label { font-weight: 500; padding: 8px 12px; background: var(--surface-secondary, #f9fafb); font-size: 12px; white-space: nowrap; }

  <main id="main-content" class="cmp-main">
    <h1>Compare AI Models</h1>
    <p>Select up to 3 models to compare side by side.</p>
    <div class="cmp-search-wrap">
      <input type="text" id="msearch" placeholder="Type to search models..." class="cmp-search">
      <div id="mdrop" class="cmp-drop"></div>
    </div>
    <div id="chips" class="cmp-chips"></div>
    <button id="cbtn" onclick="runComparison()" disabled class="cmp-btn">
      Compare Selected
    </button>
    <div id="cout" class="cmp-out"></div>
  </main>
  <script>
  let models=[], selected=[];
  fetch('data/models.json').then(r=>r.json()).then(data=>{
    models=data.models.filter(m=>!m.platformType||m.platformType==='local');
    const inp=document.getElementById('msearch'), drop=document.getElementById('mdrop');
    inp.addEventListener('input',()=>{
      const q=inp.value.toLowerCase().trim();
      if(!q){drop.style.display='none';return;}
      const r=models.filter(m=>(m.name||'').toLowerCase().includes(q)||(m.ollamaTag||'').includes(q)).slice(0,8);
      drop.innerHTML=r.map(m=>`<div onclick="pick('${(m.id||m.name).replace(/'/g,"\\'")}')" class="cmp-drop-item">`+
        `<strong>${m.name}</strong> <span class="cmp-drop-tag">${m.ollamaTag}</span></div>`).join('');
      drop.style.display=r.length?'block':'none';
    });
    document.addEventListener('click',e=>{if(!e.target.closest('#msearch')&&!e.target.closest('#mdrop'))drop.style.display='none';});
  });
  function pick(id){
    if(selected.length>=3)return;
    const m=models.find(x=>(x.id||x.name)===id);
    if(!m||selected.find(x=>(x.id||x.name)===id))return;
    selected.push(m);
    document.getElementById('msearch').value=''; document.getElementById('mdrop').style.display='none';
    renderChips();
    document.getElementById('cbtn').disabled=selected.length<2;
  }
  function remove(id){
    selected=selected.filter(m=>(m.id||m.name)!==id); renderChips();
    document.getElementById('cbtn').disabled=selected.length<2;
  }
  function renderChips(){
    document.getElementById('chips').innerHTML=selected.map(m=>
      `<span class="cmp-chip">`+
      `${m.name}<button onclick="remove('${(m.id||m.name).replace(/'/g,"\\'")}')" class="cmp-chip-x">×</button></span>`).join('');
  }
  const FIELDS=[
    {l:'Model',f:m=>m.name},{l:'Tag',f:m=>m.ollamaTag||'—'},{l:'Size',f:m=>m.size||m.parameterSize||'—'},
    {l:'Min VRAM',f:m=>m.minVram===0?'CPU only':m.vramGB?`${m.vramGB}GB`:'—'},
    {l:'Storage',f:m=>m.expectations?.storage||'—'},{l:'Startup',f:m=>m.expectations?.startupTime||'—'},
    {l:'Setup',f:m=>m.expectations?.setupTime||'—'},{l:'Difficulty',f:m=>m.expectations?.difficulty||'—'},
    {l:'Internet',f:m=>m.expectations?.internetRequired||'No'},{l:'Privacy',f:m=>m.expectations?.privacy||'Fully local'},
    {l:'Context',f:m=>m.contextLength?`${Math.round(m.contextLength/1000)}K`:'—'},
    {l:'Best For',f:m=>{let b=m.bestForDisplay||m.bestFor||'';b=Array.isArray(b)?b.slice(0,2).join(', '):''+b;return b||'—';}},
    {l:'Install',f:m=>m.installCommand||`ollama pull ${m.ollamaTag}`}
  ];
  function runComparison(){
    const rows=FIELDS.map(f=>
      `<tr><td class="cmp-td-label">${f.l}</td>`+
      selected.map(m=>`<td class="cmp-td">${f.f(m)}</td>`).join('')+`</tr>`).join('');
    const out=document.getElementById('cout');
    out.style.display='block';
    out.innerHTML=`<table class="cmp-table">`+
      `<thead><tr><th class="cmp-th-empty"></th>`+
      selected.map(m=>`<th class="cmp-th">${m.name}</th>`).join('')+
      `</tr></thead><tbody>${rows}</tbody></table>`;
    out.scrollIntoView({behavior:'smooth'});
  }
  </script>
