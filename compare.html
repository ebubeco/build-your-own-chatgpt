<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Local AI Models — Build Your Own ChatGPT</title>
  <meta name="description" content="Compare local AI models side by side. Storage, VRAM, startup time, and use case ratings for every Ollama model.">
  <meta property="og:image" content="https://build-your-own-chatgpt.vercel.app/og-image.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>!function(){var t=localStorage.getItem('theme');if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')}();</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <nav class="site-topbar" role="navigation" aria-label="Site navigation">
    <div class="container">
      <div class="topbar-inner">
        <a href="index.html" style="text-decoration:none">
          <span class="site-brand">🤖 Build Your Own ChatGPT</span>
        </a>
        <div style="display:flex;gap:0.75rem;align-items:center">
          <a href="compare.html" style="font-size:0.82rem;color:var(--accent);text-decoration:none;font-weight:600">Compare</a>
          <a href="which-ai.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Which AI</a>
          <a href="upgrade.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Upgrade</a>
          <a href="cost.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">Cost</a>
          <a href="compendium.html" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;font-weight:500">All Models</a>
          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light/dark mode">
            <span class="toggle-icon">🌙</span>
          </button>
        </div>
      </div>
    </div>
  </nav>
  <main style="max-width:940px;margin:0 auto;padding:2rem 1rem;">
    <h1>Compare AI Models</h1>
    <p>Select up to 3 models to compare side by side.</p>
    <div style="position:relative;margin-bottom:1rem;">
      <input type="text" id="msearch" placeholder="Type to search models..."
        style="width:100%;padding:10px 14px;font-size:14px;border:1px solid var(--border,#ddd);border-radius:8px;background:var(--surface,#fff);color:var(--text-primary,#111);">
      <div id="mdrop" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface,#fff);border:1px solid var(--border,#ddd);border-radius:8px;z-index:100;max-height:300px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);"></div>
    </div>
    <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;"></div>
    <button id="cbtn" onclick="runComparison()" disabled
      style="padding:10px 20px;font-size:14px;background:#3C3489;color:#fff;border:none;border-radius:8px;cursor:pointer;opacity:.5;">
      Compare Selected
    </button>
    <div id="cout" style="display:none;margin-top:2rem;overflow-x:auto;"></div>
  </main>
  <script>
  let models=[], selected=[];
  fetch('data/models.json').then(r=>r.json()).then(data=>{
    models=data.models.filter(m=>!m.platformType||m.platformType==='local');
    const inp=document.getElementById('msearch'), drop=document.getElementById('mdrop');
    inp.addEventListener('input',()=>{
      const q=inp.value.toLowerCase().trim();
      if(!q){drop.style.display='none';return;}
      const r=models.filter(m=>(m.name||'').toLowerCase().includes(q)||(m.ollamaTag||'').includes(q)).slice(0,8);
      drop.innerHTML=r.map(m=>`<div onclick="pick('${(m.id||m.name).replace(/'/g,"\\'")}')"`+
        ` style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border,#eee);">`+
        `<strong>${m.name}</strong> <span style="color:#888;font-family:monospace;font-size:11px;">${m.ollamaTag}</span></div>`).join('');
      drop.style.display=r.length?'block':'none';
    });
    document.addEventListener('click',e=>{if(!e.target.closest('#msearch')&&!e.target.closest('#mdrop'))drop.style.display='none';});
  });
  function pick(id){
    if(selected.length>=3)return;
    const m=models.find(x=>(x.id||x.name)===id);
    if(!m||selected.find(x=>(x.id||x.name)===id))return;
    selected.push(m);
    document.getElementById('msearch').value=''; document.getElementById('mdrop').style.display='none';
    renderChips();
    const b=document.getElementById('cbtn'); b.disabled=selected.length<2; b.style.opacity=selected.length<2?'.5':'1';
  }
  function remove(id){
    selected=selected.filter(m=>(m.id||m.name)!==id); renderChips();
    const b=document.getElementById('cbtn'); b.disabled=selected.length<2; b.style.opacity=selected.length<2?'.5':'1';
  }
  function renderChips(){
    document.getElementById('chips').innerHTML=selected.map(m=>
      `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--surface-secondary,#f3f4f6);border-radius:20px;font-size:12px;">`+
      `${m.name}<button onclick="remove('${(m.id||m.name).replace(/'/g,"\\'")}')"`+
      ` style="background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:0;">×</button></span>`).join('');
  }
  const FIELDS=[
    {l:'Model',f:m=>m.name},{l:'Tag',f:m=>m.ollamaTag||'—'},{l:'Size',f:m=>m.size||m.parameterSize||'—'},
    {l:'Min VRAM',f:m=>m.minVram===0?'CPU only':m.vramGB?`${m.vramGB}GB`:'—'},
    {l:'Storage',f:m=>m.expectations?.storage||'—'},{l:'Startup',f:m=>m.expectations?.startupTime||'—'},
    {l:'Setup',f:m=>m.expectations?.setupTime||'—'},{l:'Difficulty',f:m=>m.expectations?.difficulty||'—'},
    {l:'Internet',f:m=>m.expectations?.internetRequired||'No'},{l:'Privacy',f:m=>m.expectations?.privacy||'Fully local'},
    {l:'Context',f:m=>m.contextLength?`${Math.round(m.contextLength/1000)}K`:'—'},
    {l:'Best For',f:m=>{let b=m.bestForDisplay||m.bestFor||'';b=Array.isArray(b)?b.slice(0,2).join(', '):''+b;return b||'—';}},
    {l:'Install',f:m=>m.installCommand||`ollama pull ${m.ollamaTag}`}
  ];
  function runComparison(){
    const rows=FIELDS.map(f=>
      `<tr><td style="font-weight:500;padding:8px 12px;background:var(--surface-secondary,#f9fafb);font-size:12px;white-space:nowrap;">${f.l}</td>`+
      selected.map(m=>`<td style="padding:8px 12px;font-size:12px;">${f.f(m)}</td>`).join('')+`</tr>`).join('');
    const out=document.getElementById('cout');
    out.style.display='block';
    out.innerHTML=`<table style="width:100%;border-collapse:collapse;border:1px solid var(--border,#eee);border-radius:8px;overflow:hidden;">`+
      `<thead><tr><th style="padding:10px 12px;text-align:left;background:var(--surface-secondary,#f3f4f6);font-size:12px;"></th>`+
      selected.map(m=>`<th style="padding:10px 12px;text-align:left;background:var(--surface-secondary,#f3f4f6);font-size:13px;">${m.name}</th>`).join('')+
      `</tr></thead><tbody>${rows}</tbody></table>`;
    out.scrollIntoView({behavior:'smooth'});
  }
  </script>
  <script>
    document.getElementById('theme-toggle').addEventListener('click',function(){var e=document.documentElement;var t=e.getAttribute('data-theme');var n=t==='dark'?'light':'dark';e.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.querySelector('.toggle-icon').textContent=n==='dark'?'☾':'☀';});
    if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.querySelector('.toggle-icon').textContent='☾';}
  </script>
  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/ebubeco/build-your-own-chatgpt">GitHub</a>
        <a href="index.html">Wizard</a>
        <a href="compendium.html">All Models</a>
        <a href="cost.html">Cost</a>
        <a href="career.html">Career</a>
        <a href="evaluators.html">Evaluators</a>
      </div>
      <p class="footer-tagline">Built for beginners. Your data never leaves your machine.</p>
    </div>
  </footer>
  <script src="shared.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
